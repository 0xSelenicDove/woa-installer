name: Build phone tools
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu make file curl
      - run: sh phone-tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phone-tools
          path: dist/phone-tools-aarch64.tar.gz*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/phone-tools-aarch64.tar.gz*
