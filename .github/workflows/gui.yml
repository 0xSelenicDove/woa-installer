name: Build GUI
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python tests/test_gpt.py
      - run: python tests/test_bcd.py
      - run: pyinstaller --onefile --windowed --name woa-installer woa_gui.py
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "WOA Installer" -srcfolder dist/woa-installer.app \
            -ov -format UDZO dist/woa-installer-macos.dmg
      - name: Package (Windows exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist\woa-installer.exe dist\woa-installer-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: |
            dist/woa-installer-macos.dmg
            dist/woa-installer-windows.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/woa-installer-macos.dmg
            dist/woa-installer-windows.exe
